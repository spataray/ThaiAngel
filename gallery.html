<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="screensaver.css">
    <style>
        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 10px;
         }
     </style>
</head>
<body>
    <!-- Screensaver Controls -->
    <div class="controls">
        <button id="screensaverBtn">Start Screensaver</button>
        <button id="settingsBtn">Settings</button>
    </div>

    <h1>Gallery</h1>
    <div class="gallery">
      <img src="images/TAStation-1.JPG" alt="TA Station 1" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-2.JPG" alt="TA Station 2" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-3.JPG" alt="TA Station 3" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-4.JPG" alt="TA Station 4" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-5.JPG" alt="TA Station 5" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-6.JPG" alt="TA Station 6" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-7.JPG" alt="TA Station 7" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-8.JPG" alt="TA Station 8" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-9.JPG" alt="TA Station 9" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-10.JPG" alt="TA Station 10" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-11.JPG" alt="TA Station 11" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-12.JPG" alt="TA Station 12" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-13.JPG" alt="TA Station 13" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-14.JPG" alt="TA Station 14" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-15.JPG" alt="TA Station 15" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-16.JPG" alt="TA Station 16" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-17.JPG" alt="TA Station 17" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-18.JPG" alt="TA Station 18" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-19.JPG" alt="TA Station 19" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-20.JPG" alt="TA Station 20" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-21.JPG" alt="TA Station 21" style="max-width: 100%; height: auto;">
      <img src="images/TAStation-22.JPG" alt="TA Station 22" style="max-width: 100%; height: auto;">
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header-bar">
                <h2>⚙️ Settings</h2>
                <div>
                    <button id="saveSettingsTop" class="top-save-btn">Save & Close</button>
                    <span class="close" style="margin-left: 10px; float: none; vertical-align: middle;">&times;</span>
                </div>
            </div>

            <div class="modal-grid-2col">
                <div class="modal-grid-full">
                    <label>Establishment / Venue Name:</label>
                    <input type="text" id="establishmentName" value="T.A. Station" placeholder="e.g. T.A. Station">
                </div>

                <div>
                    <label>Time per image (sec):</label>
                    <input type="number" id="intervalTime" value="5" min="1" max="60">
                </div>

                <div>
                    <label>Transition Effect:</label>
                    <select id="transitionEffect">
                        <option value="fade">Fade</option>
                        <option value="slide">Slide</option>
                        <option value="zoom">Zoom (Ken Burns)</option>
                        <option value="pan-zoom">Pan & Zoom (Smart)</option>
                        <option value="crossfade">Cross Fade</option>
                    </select>
                </div>

                <div>
                    <label>Clock format:</label>
                    <select id="clockFormat">
                        <option value="24">24-hour (13:45)</option>
                        <option value="12">12-hour (1:45 PM)</option>
                    </select>
                </div>

                <div>
                    <label style="margin-top: 10px;">
                        <input type="checkbox" id="showClock" checked>
                        Show clock
                    </label>
                </div>

                <div class="modal-grid-full">
                    <label style="margin-top: 6px;">
                        <input type="checkbox" id="showPhotoInfo">
                        Show photo information
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Screensaver Container -->
    <div id="screensaverContainer" style="display: none;">
        <div id="loadingIndicator" class="loading-spinner">
            <div class="spinner"></div>
        </div>
        <div id="screensaverClock"></div>
        <div id="screensaverImage"></div>
        <div id="photoInfo" class="photo-info">
            <span id="photoName"></span>
            <span id="photoCount"></span>
        </div>
    </div>

    <!-- Screensaver JavaScript -->
    <script src="screensaver.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var images = [];
            var galleryImages = document.querySelectorAll('.gallery img');
            for (var i = 0; i < galleryImages.length; i++) {
                images.push(galleryImages[i].src);
            }
            TAScreensaver.initialize(images);

            document.getElementById('screensaverBtn').addEventListener('click', function() {
                TAScreensaver.start();
            });

            document.getElementById('screensaverContainer').addEventListener('click', function() {
                TAScreensaver.stop();
            });

            // Modal Controls (Auto-save on close)
            var modal = document.getElementById('settingsModal');
            var settingsBtn = document.getElementById('settingsBtn');
            var closeBtn = document.querySelector('.close');
            var saveBtnTop = document.getElementById('saveSettingsTop');

            function openModal() {
                TAScreensaver.populateSettingsModal();
                if (modal) modal.style.display = 'flex';
            }

            function updateGalleryVenueUI() {
                var name = TAScreensaver.getEstablishmentName();
                var h1 = document.querySelector('h1');
                if (h1) h1.textContent = name + ' Gallery';
                document.title = name + ' Gallery';
            }
            updateGalleryVenueUI();

            function saveAndCloseModal() {
                if (TAScreensaver.saveSettingsFromModal()) {
                    updateGalleryVenueUI();
                }
                if (modal) modal.style.display = 'none';
            }

            if (settingsBtn) settingsBtn.addEventListener('click', openModal);
            if (saveBtnTop) saveBtnTop.addEventListener('click', saveAndCloseModal);
            if (closeBtn) closeBtn.addEventListener('click', saveAndCloseModal);

            window.addEventListener('click', function(e) {
                if (e.target === modal) {
                    saveAndCloseModal();
                }
            });
        });
    </script>
</body>
</html>
